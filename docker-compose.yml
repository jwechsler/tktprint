services:
  # Rails application
  web:
    build: .
    container_name: tktprint_web
    command: >
      bash -c "
        echo 'Waiting for database setup to complete...' &&
        while [ ! -f /tmp/db_ready ]; do sleep 1; done &&
        echo 'Database ready, starting Rails server...' &&
        rm -f /app/tmp/pids/server.pid &&
        bundle exec rails server -b 0.0.0.0 -e $${RAILS_ENV:-development}
      "
    volumes:
      - .:/app:cached
      - bundle_cache:/usr/local/bundle
      - db_ready:/tmp
      - ./config/printer.yml.${PRINTER_CONFIG:-test}:/app/config/printer.yml:ro
    ports:
      - "3000:3000"
    environment:
      - RAILS_ENV=${RAILS_ENV:-development}
      # Local time for logs and tracking codes. Don't mount /etc/localtime: the image's
      # /etc/localtime links to zoneinfo/Etc/UTC, so the mount replaces the UTC zone itself
      - TZ=${TZ:-America/Chicago}
      - DATABASE_URL=sqlite3:db/${RAILS_ENV:-development}.sqlite3
      - SECRET_KEY_BASE=${SECRET_KEY_BASE:-}
      - RAILS_LOG_TO_STDOUT=true
      - MOCK_PRINTING=${MOCK_PRINTING:-true}
      - PRINT_MAX_RETRIES=${PRINT_MAX_RETRIES:-3}
      - PRINT_RETRY_DELAY=${PRINT_RETRY_DELAY:-5}
      - PRINT_BATCH_SIZE=${PRINT_BATCH_SIZE:-50}
      - PRINT_BATCH_TIMEOUT=${PRINT_BATCH_TIMEOUT:-300}
      - PRINT_CONNECTION_TIMEOUT=${PRINT_CONNECTION_TIMEOUT:-30}
      - PRINT_READ_TIMEOUT=${PRINT_READ_TIMEOUT:-30}
      - PRINT_EMULATOR_DELAY=${PRINT_EMULATOR_DELAY:-0.5}
    depends_on:
      db_setup:
        condition: service_started
      boca_printer:
        condition: service_started
        required: false
    networks:
      - tktprint_network
      - site_default
    stdin_open: true
    tty: true

  # Background job worker
  worker:
    build: .
    container_name: tktprint_worker
    command: >
      bash -c "
        echo 'Waiting for database setup to complete...' &&
        while [ ! -f /tmp/db_ready ]; do sleep 1; done &&
        echo 'Database ready, starting Delayed Job worker...' &&
        bundle exec bin/delayed_job run
      "
    volumes:
      - .:/app:cached
      - bundle_cache:/usr/local/bundle
      - db_ready:/tmp
      - ./config/printer.yml.${PRINTER_CONFIG:-test}:/app/config/printer.yml:ro
    environment:
      - RAILS_ENV=${RAILS_ENV:-development}
      - TZ=${TZ:-America/Chicago}
      - DATABASE_URL=sqlite3:db/${RAILS_ENV:-development}.sqlite3
      - SECRET_KEY_BASE=${SECRET_KEY_BASE:-}
      - RAILS_LOG_TO_STDOUT=true
      - MOCK_PRINTING=${MOCK_PRINTING:-true}
      - PRINT_MAX_RETRIES=${PRINT_MAX_RETRIES:-3}
      - PRINT_RETRY_DELAY=${PRINT_RETRY_DELAY:-5}
      - PRINT_BATCH_SIZE=${PRINT_BATCH_SIZE:-50}
      - PRINT_BATCH_TIMEOUT=${PRINT_BATCH_TIMEOUT:-300}
      - PRINT_CONNECTION_TIMEOUT=${PRINT_CONNECTION_TIMEOUT:-30}
      - PRINT_READ_TIMEOUT=${PRINT_READ_TIMEOUT:-30}
      - PRINT_EMULATOR_DELAY=${PRINT_EMULATOR_DELAY:-0.5}
    depends_on:
      db_setup:
        condition: service_started
      web:
        condition: service_started
      boca_printer:
        condition: service_started
        required: false
    networks:
      - tktprint_network
      - site_default

  # Database setup (runs once)
  db_setup:
    build: .
    container_name: tktprint_db_setup
    command: >
      bash -c "
        if [ -f db/$${RAILS_ENV:-development}.sqlite3 ]; then
          echo 'Existing database found — running migrations only' &&
          bundle exec rails db:migrate;
        else
          echo 'No database found — creating and migrating' &&
          bundle exec rails db:create &&
          bundle exec rails db:migrate;
        fi &&
        echo 'Database setup complete' &&
        touch /tmp/db_ready
      "
    volumes:
      - .:/app:cached
      - bundle_cache:/usr/local/bundle
      - db_ready:/tmp
    environment:
      - RAILS_ENV=${RAILS_ENV:-development}
      - TZ=${TZ:-America/Chicago}
      - DATABASE_URL=sqlite3:db/${RAILS_ENV:-development}.sqlite3
      - SECRET_KEY_BASE=${SECRET_KEY_BASE:-}
    networks:
      - tktprint_network

  # Virtual Boca printer for test mode (./start-printer.sh -m test).
  # Listens on 9100 like a real Boca and renders every ticket the app prints
  # to a sequentially numbered PDF (plus the raw .fgl and an index.jsonl line)
  # in ./tmp/printed_tickets. See https://github.com/jwechsler/fgl-pdf
  boca_printer:
    profiles:
      - test
    build:
      context: https://github.com/jwechsler/fgl-pdf.git#${FGL_PDF_REF:-main}
    container_name: tktprint_printer
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: ["fgl-printer", "--out", "/tickets", "--dpi", "300"]
    environment:
      - FGL_PDF_LENGTH_IN=${FGL_PDF_LENGTH_IN:-5.5}
      # Theater Wit's Boca self-test: PRINT LENGTH=1689 dots on 5.5" stock (1689 / 5.5)
      - FGL_PDF_FEED_DPI=${FGL_PDF_FEED_DPI:-307.1}
      # Self-test PRINT WIDTH=576: rows 576-599 of the 2" stock are never imaged
      - FGL_PDF_PRINT_WIDTH=${FGL_PDF_PRINT_WIDTH:-576}
      - FGL_PDF_ANNOTATE=${FGL_PDF_ANNOTATE:-false}
      - FGL_PDF_DEBUG_GRID=${FGL_PDF_DEBUG_GRID:-false}
      # Real Verdana for <RTF3..6> text; the printer falls back to DejaVu Sans
      # for any face not found here. Never commit Verdana files.
      - FGL_PDF_FONT_DIR=/fonts
    volumes:
      - ./tmp/printed_tickets:/tickets
      - ${BOCA_FONT_DIR:-./tmp/fonts}:/fonts:ro
    ports:
      - "127.0.0.1:${BOCA_PRINTER_PORT:-9100}:9100"
    networks:
      - tktprint_network

volumes:
  bundle_cache:
  db_ready:

networks:
  tktprint_network:
    driver: bridge
  site_default:
    external: true